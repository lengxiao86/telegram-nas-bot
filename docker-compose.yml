services:
  telegram-bot-api:
    build:
      context: .
      dockerfile: Dockerfile.telegram-bot-api
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    command:
      - --api-id=${TELEGRAM_API_ID}
      - --api-hash=${TELEGRAM_API_HASH}
      - --local
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
    volumes:
      # Shared with the bot because local mode returns local file paths.
      - telegram-api-data:/var/lib/telegram-bot-api

  telegram-nas-bot:
    build: .
    container_name: telegram-nas-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # The bot switches to Telegram's Local Bot API Server automatically.
      LOCAL_BOT_API_URL: http://telegram-bot-api:8081
    volumes:
      # Set NAS_VIDEO_DIR in .env. The right-hand /data must stay unchanged.
      - ${NAS_VIDEO_DIR}:/data
      # The bot removes only expired video cache files from this shared volume.
      - telegram-api-data:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api

volumes:
  telegram-api-data:
